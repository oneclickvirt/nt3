name: Build and Release

on:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  # release:
  #   types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.24.5'
      
    - name: Test on Default Platform
      run: |
        # 检查是否有测试文件
        if find . -name "*_test.go" -type f | grep -q .; then
          go test -v ./...
        else
          echo "No test files found, skipping tests"
          go build -v ./...
        fi
    
    - name: Delete Existing Release Assets
      run: |
        release_id=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/oneclickvirt/nt3/releases/tags/output" | jq -r '.id')
        echo "Deleting existing release assets..."
        assets=$(curl -s -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/oneclickvirt/nt3/releases/$release_id/assets" | jq -r '.[] | .id')
        for asset in $assets; do
          echo "Deleting asset with ID: $asset"
          curl -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/oneclickvirt/nt3/releases/assets/$asset"
        done
        sleep 10

  release-binary:
    name: Release Go Binary
    runs-on: ubuntu-latest
    needs: build
    env:
      CGO_ENABLED: 0
    strategy:
      matrix:
        goos: [windows, freebsd, linux, darwin]
        goarch: [amd64, 386]
        exclude:
          - goarch: 386
            goos: darwin
        include:
          - goos: windows
            goarch: 386
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips
          - goos: freebsd
            goarch: arm64
          - goos: freebsd
            goarch: arm
            goarm: 7
          # - goos: linux
          #   goarch: mipsle
          #   gomips: softfloat
          # - goos: linux
          #   goarch: mips
          #   gomips: softfloat
          # - goos: linux
          #   goarch: arm
          #   goarm: 6
          # - goos: linux
          #   goarch: arm
          #   goarm: 5
          # - goos: linux
          #   goarch: ppc64
          # - goos: linux
          #   goarch: ppc64le
          # - goos: windows
          #   goarch: arm
          #   goarm: 7
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.22'

    - name: Build and Release
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        GOARM: ${{ matrix.goarm }}
      run: |
        mkdir -p bin
        cd cmd
        go build \
          -o ../bin/nt3-${{ matrix.goos }}-${{ matrix.goarch }} \
          -v \
          -ldflags="-extldflags=-static -checklinkname=0 -s -w" \
          -trimpath \
          .
          
    - name: Upload New Assets
      run: |
        release_id=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/oneclickvirt/nt3/releases/tags/output" | jq -r '.id')
        echo "Uploading new assets to release..."
        for file in ./bin/*; do
          echo "Uploading $file to release..."
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$file" \
            "https://uploads.github.com/repos/oneclickvirt/nt3/releases/$release_id/assets?name=$(basename "$file")"
          rm -rf $file
        done
