name: Build and Release
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOPROXY: https://proxy.golang.org|direct
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        check-latest: true
    - name: Test on Default Platform
      run: |
        # 检查是否有测试文件
        if find . -name "*_test.go" -type f | grep -q .; then
          go test -v ./...
        else
          echo "No test files found, skipping tests"
          go build -v ./...
        fi
    - name: Preserve the last published assets until new binaries are built
      run: |
        echo "Existing release assets are retained until each validated replacement is uploaded."
  release-binary:
    name: Release Go Binary
    runs-on: ubuntu-latest
    needs: build
    env:
      CGO_ENABLED: 0
      GOPROXY: https://proxy.golang.org|direct
    strategy:
      matrix:
        goos:
        - windows
        - freebsd
        - linux
        goarch:
        - amd64
        - 386
        include:
        - goos: windows
          goarch: 386
        - goos: windows
          goarch: amd64
        - goos: windows
          goarch: arm64
        - goos: linux
          goarch: arm
          goarm: 7
        - goos: linux
          goarch: arm64
        - goos: linux
          goarch: riscv64
        - goos: linux
          goarch: mips64
        - goos: linux
          goarch: mips64le
        - goos: linux
          goarch: mipsle
        - goos: linux
          goarch: mips
        - goos: freebsd
          goarch: arm64
        - goos: freebsd
          goarch: arm
          goarm: 7
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/nt3/main/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/nt3/main/.github/scripts/release_assets.py" -o "$RUNNER_TEMP/ci-release-assets.py"
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        check-latest: true
    - name: Build and Release
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        GOARM: ${{ matrix.goarm }}
      run: "mkdir -p bin\ncd cmd\ngo build \\\n  -o ../bin/nt3-${{ matrix.goos }}-${{ matrix.goarch }} \\\n  -v\
        \ \\\n  -ldflags=\"-extldflags=-static -checklinkname=0 -s -w\" \\\n  -trimpath \\\n  .\n  \n"
    - name: Upload New Assets
      run: |
        source "$RUNNER_TEMP/ci-network.sh"
        set -euo pipefail
        shopt -s nullglob
        files=(./bin/*)
        [[ ${#files[@]} -gt 0 ]] || { echo "No release binaries were built." >&2; exit 1; }
        gh release view output --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create output --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title output --notes "Validated component binaries"
        for file in "${files[@]}"; do
          [[ -f "$file" && -s "$file" ]] || { echo "Invalid release binary." >&2; exit 1; }
        done
        python3 "$RUNNER_TEMP/ci-release-assets.py" output "${files[@]}"
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
    concurrency:
      group: release-assets-${{ github.repository }}-linux-${{ matrix.goarch }}
      cancel-in-progress: false
  release-darwin:
    name: Release Go Binary (Darwin)
    runs-on: macos-latest
    needs: build
    env:
      CGO_ENABLED: 1
      GOOS: darwin
      GOPROXY: https://proxy.golang.org|direct
    strategy:
      matrix:
        goarch:
        - amd64
        - arm64
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/nt3/main/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/nt3/main/.github/scripts/release_assets.py" -o "$RUNNER_TEMP/ci-release-assets.py"
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        check-latest: true
    - name: Build and Release
      env:
        GOARCH: ${{ matrix.goarch }}
      run: "mkdir -p bin\ncd cmd\ngo build \\\n  -o ../bin/nt3-darwin-${{ matrix.goarch }} \\\n  -v \\\n  -ldflags=\"\
        -checklinkname=0 -s -w\" \\\n  -trimpath \\\n  .\n  \n"
    - name: Upload New Assets
      run: |
        source "$RUNNER_TEMP/ci-network.sh"
        set -euo pipefail
        shopt -s nullglob
        files=(./bin/*)
        [[ ${#files[@]} -gt 0 ]] || { echo "No release binaries were built." >&2; exit 1; }
        gh release view output --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create output --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title output --notes "Validated component binaries"
        for file in "${files[@]}"; do
          [[ -f "$file" && -s "$file" ]] || { echo "Invalid release binary." >&2; exit 1; }
        done
        python3 "$RUNNER_TEMP/ci-release-assets.py" output "${files[@]}"
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
    concurrency:
      group: release-assets-${{ github.repository }}-linux-${{ matrix.goarch }}
      cancel-in-progress: false
'on':
  workflow_dispatch: null
permissions:
  contents: write
